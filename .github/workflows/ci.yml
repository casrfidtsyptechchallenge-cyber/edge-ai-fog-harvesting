# Runs on every push and pull request: the station's Python tests, the node libraries' PC tests,
# and a compile check of the portable C++ for the MCX's Cortex-M33.
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests (contract, station, sim, ml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m pytest -q

  native:
    name: Node libraries, PC tests (pio test -e native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/node/platformio.ini') }}
      - run: python -m pip install platformio
      - run: pio test -e native
        working-directory: firmware/node

  cortex-m33:
    name: Portable C++ compiles for the MCX (Cortex-M33)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Compile safety, edge_ai and controller
        working-directory: firmware/node
        run: |
          INC=$(find lib -type d -printf "-I%p ")
          for f in lib/safety/*.cpp lib/edge_ai/*.cpp lib/controller/*.cpp; do
            echo "$f"
            arm-none-eabi-g++ -mthumb -mcpu=cortex-m33 -mfloat-abi=hard -mfpu=fpv5-sp-d16 -O2 -std=gnu++11 \
              -fno-exceptions -fno-rtti -I include -I ../mcx_bench/third_party $INC -c "$f" -o /tmp/out.o
          done
