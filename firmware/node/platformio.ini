; AeroIon-Edge collector node firmware.
;
;   pio run -e esp32s3                  build for an ESP32-S3 DevKitC-1
;   pio run -e esp32s3 -t upload        build and flash
;   pio device monitor                  watch the serial output
;   pio test -e native                  run the tests on the PC, no ESP32 needed

[platformio]
default_envs = esp32s3

[env]
lib_deps = bblanchon/ArduinoJson@^7.4.2
build_flags = 
    -I include
    -D ARDUINOJSON_USE_LONG_LONG=1

[esp_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags = 
    ${env.build_flags}
    -D AEROION_BUILD_EPOCH_S=$UNIX_TIME
; src/link/ is the ESP32 of the two-chip node (envs esp32s3-link below), not part of these builds
build_src_filter = +<*> -<link/>

[env:esp32s3]
extends = esp_common
board = esp32-s3-devkitc-1
; If your board prints nothing on the USB port marked "USB" (not "UART"), add:
;   -D ARDUINO_USB_CDC_ON_BOOT=1
; to build_flags above.

[env:esp32]
extends = esp_common
board = esp32dev

; M7: the ESP32-S3 of a two-chip node (with the MCX A156, firmware/mcx_node): Wi-Fi, MQTT, the UART to the
; MCX, the load cell and the SHT45. Copy include/wifi_secrets.example.h to include/wifi_secrets.h first.
;   pio run -e esp32s3-link -t upload        real board
;   pio run -e esp32s3-link-wokwi            Wokwi: then open wokwi/link/wokwi.toml (docs/link.md)
[env:esp32s3-link]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<link/> +<sensors/hx711_sensor.cpp> +<sensors/sht45_sensor.cpp> +<watchdog.cpp>
; read every file of each library to find what it needs (lib/link -> lib/rfid -> lib/drivers -> lib/sensing)
lib_ldf_mode = deep
lib_deps = 
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8

[env:esp32s3-link-wokwi]
extends = env:esp32s3-link
build_flags = 
    ${esp_common.build_flags}
    -D AEROION_WOKWI=1


[env:native]
platform = native
test_framework = unity
lib_ldf_mode = deep
build_flags = 
    ${env.build_flags}
    -std=gnu++11